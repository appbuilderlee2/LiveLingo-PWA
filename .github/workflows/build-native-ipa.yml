name: Build LiveLingo Native IPA
# Build requested after enabling low-latency live captions (0d48c5b).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-native-ipa.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out native iOS development branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-ios-starter
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/LiveLingoNative
        run: xcodegen generate
      - name: Build unsigned iPhone app
        working-directory: ios/LiveLingoNative
        run: |
          xcodebuild -project LiveLingoNative.xcodeproj -scheme LiveLingoNative -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        working-directory: ios/LiveLingoNative
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LiveLingoNative.app Payload/
          zip -qr LiveLingoNative-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveLingoNative-unsigned-IPA
          path: ios/LiveLingoNative/LiveLingoNative-unsigned.ipa
